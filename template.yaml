AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Project 4 - Event-driven Orders application (API Gateway, Lambda, DynamoDB, Cognito,
  EventBridge, SQS, SNS, CloudWatch).

Parameters:
  PowertoolsLayerArn:
    Type: String
    Description: >
      Powertools for AWS Lambda (Python) layer, pinned. Latest is published at SSM
      /aws/service/powertools/python/arm64/python3.12/latest
    Default: arn:aws:lambda:us-east-1:017000801446:layer:AWSLambdaPowertoolsPythonV3-python312-arm64:39
  AppVersion:
    Type: String
    Description: Deployed version (the CI pipeline passes the git commit SHA)
    Default: local

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    # X-Ray active tracing (SAM adds the xray:Put* permissions)
    Tracing: Active
    Layers:
      - !Ref PowertoolsLayerArn
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: orders
        POWERTOOLS_LOG_LEVEL: INFO
        APP_VERSION: !Ref AppVersion
    Tags:
      project: event-driven-orders

Resources:
  # ---------------------------------------------------------------------------
  # Exercise 0 (baseline): Orders table - one header item (sk = ORDER) plus one
  # item per order line (sk = ITEM#<itemId>) under the same orderId
  # ---------------------------------------------------------------------------
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-Orders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: project
          Value: event-driven-orders

  # ---------------------------------------------------------------------------
  # Exercise 0 (baseline): CreateOrder Lambda
  # Exercise 6: no longer behind the API - consumes the intake queue that API Gateway writes to
  # ---------------------------------------------------------------------------
  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-CreateOrder'
      Description: Consumes accepted orders from SQS, saves them and publishes OrderCreated
      CodeUri: src/create_order/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          EVENT_BUS_NAME: !Ref OrdersEventBus
      Policies:
        # Least privilege: write actions on this table only (TransactWriteItems is
        # authorised per contained PutItem)
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
        # Exercise 1: events:PutEvents on the orders bus only
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref OrdersEventBus
      Events:
        OrderIntakeQueue:
          Type: SQS   # SAM adds the sqs:ReceiveMessage/DeleteMessage/GetQueueAttributes policy
          Properties:
            Queue: !GetAtt OrderIntakeQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 0   # exercise 2: a window adds up to ~20 s latency
            FunctionResponseTypes:
              - ReportBatchItemFailures

  CreateOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CreateOrderFunction}'
      RetentionInDays: 14

  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      Description: Orders REST API
      StageName: prod
      # Setting OpenApiVersion stops SAM from also creating an extra default "Stage" stage
      OpenApiVersion: '3.0.1'
      # Exercise 6: asynchronous API. Both routes are direct AWS service integrations (no Lambda
      # in the request path), which need an OpenAPI body. SAM applies the default Cognito
      # authorizer to every path in it.
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Sub '${AWS::StackName}-api'
          version: '2.0'
        x-amazon-apigateway-request-validators:
          body-and-params:
            validateRequestBody: true
            validateRequestParameters: true
        x-amazon-apigateway-gateway-responses:
          # Return the schema violation instead of the generic "Invalid request body"
          BAD_REQUEST_BODY:
            statusCode: 400
            responseTemplates:
              application/json: '{"message": "$context.error.validationErrorString"}'
        paths:
          /orders/{orderId}:
            put:
              summary: >
                Accept an order asynchronously - validated by API Gateway, sent to the intake
                queue, 202 returned without waiting for CreateOrder. orderId (client-generated
                UUID) is the idempotency key.
              x-amazon-apigateway-request-validator: body-and-params
              parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                    type: string
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OrderRequest'
              responses:
                '202':
                  description: Order accepted for processing
                '400':
                  description: Invalid body or orderId
                '500':
                  description: Could not enqueue the order
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${OrderIntakeQueue.QueueName}'
                credentials: !GetAtt ApiSqsSendRole.Arn
                # Only application/json bodies (the validated model) reach SQS; others get 415
                passthroughBehavior: never
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
                  integration.request.header.Accept: "'application/json'"
                requestTemplates:
                  # Body = the validated items payload; orderId, customerId (verified Cognito
                  # sub - never from the body), request time and request id travel as message
                  # attributes. API Gateway doesn't validate path parameter formats, so the UUID
                  # check is done here: an invalid id sends a deliberately invalid SQS action,
                  # which SQS rejects with 400 and the integration response turns into a 400.
                  application/json: |
                    #set($orderId = $input.params('orderId'))
                    #if($orderId.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))
                    Action=SendMessage&MessageBody=$util.urlEncode($input.body)&MessageAttribute.1.Name=orderId&MessageAttribute.1.Value.DataType=String&MessageAttribute.1.Value.StringValue=$orderId&MessageAttribute.2.Name=customerId&MessageAttribute.2.Value.DataType=String&MessageAttribute.2.Value.StringValue=$util.urlEncode($context.authorizer.claims.sub)&MessageAttribute.3.Name=acceptedAt&MessageAttribute.3.Value.DataType=Number&MessageAttribute.3.Value.StringValue=$context.requestTimeEpoch&MessageAttribute.4.Name=requestId&MessageAttribute.4.Value.DataType=String&MessageAttribute.4.Value.StringValue=$context.requestId
                    #else
                    Action=RejectInvalidOrderId
                    #end
                responses:
                  default:
                    statusCode: '202'
                    responseTemplates:
                      application/json: |
                        {
                          "orderId": "$input.params('orderId')",
                          "status": "ACCEPTED",
                          "statusUrl": "/orders/$input.params('orderId')",
                          "messageId": "$input.path('$.SendMessageResponse.SendMessageResult.MessageId')"
                        }
                  '400':
                    statusCode: '400'
                    responseTemplates:
                      application/json: '{"message": "orderId must be a lowercase UUID, e.g. /orders/3f0c6a8e-1b2d-4c5e-8f9a-0b1c2d3e4f5a"}'
                  '40[1-9]|4[1-9]\d|5\d{2}':
                    statusCode: '500'
                    responseTemplates:
                      application/json: '{"message": "could not accept the order, please retry"}'
            get:
              summary: >
                Order status for the caller's own order - one DynamoDB BatchGetItem across the
                Orders header and the Fulfilments table (no Lambda)
              x-amazon-apigateway-request-validator: body-and-params
              parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Order status
                '404':
                  description: Unknown order, not the caller's, or not processed yet
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:dynamodb:action/BatchGetItem'
                credentials: !GetAtt ApiOrdersReadRole.Arn
                passthroughBehavior: never
                requestTemplates:
                  # A non-UUID id is replaced by "-" so it simply isn't found (and can't break
                  # out of the JSON string)
                  application/json: !Sub |
                    #set($orderId = $input.params('orderId'))
                    #if(!$orderId.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))
                    #set($orderId = '-')
                    #end
                    {
                      "RequestItems": {
                        "${OrdersTable}": {"Keys": [{"orderId": {"S": "$orderId"}, "sk": {"S": "ORDER"}}]},
                        "${FulfilmentsTable}": {"Keys": [{"orderId": {"S": "$orderId"}}]}
                      }
                    }
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      # DynamoDB JSON -> plain JSON. 404 unless the order exists AND belongs to
                      # the caller (customerId = verified Cognito sub).
                      application/json: !Sub |
                        #set($responses = $input.path('$.Responses'))
                        #set($orders = $responses.get('${OrdersTable}'))
                        #set($fulfilments = $responses.get('${FulfilmentsTable}'))
                        #if(!$orders || $orders.size() == 0 || $orders.get(0).customerId.S != $context.authorizer.claims.sub)
                        #set($context.responseOverride.status = 404)
                        {"message": "order not found (it may still be processing)"}
                        #else
                        #set($o = $orders.get(0))
                        #set($fulfilled = $fulfilments && $fulfilments.size() > 0)
                        #if($fulfilled && $o.status.S == 'CREATED')
                        #set($status = 'FULFILLED')
                        #else
                        #set($status = $o.status.S)
                        #end
                        {
                          "orderId": "$o.orderId.S",
                          "status": "$status",
                          "acceptedAt": "$!o.acceptedAt.S",
                          "createdAt": "$!o.createdAt.S"#if("$!o.total.N" != ""),
                          "total": "$o.total.N",
                          "itemCount": $o.itemCount.N#end#if("$!o.reason.S" != ""),
                          ## escapeJavaScript turns ' into \' (invalid JSON) - undo that
                          "reason": "$util.escapeJavaScript($o.reason.S).replaceAll("\\'", "'")"#end#if($fulfilled),
                          "warehouse": "$fulfilments.get(0).warehouse.S",
                          "fulfilledAt": "$fulfilments.get(0).fulfilledAt.S"#end

                        }
                        #end
                  '4\d{2}|5\d{2}':
                    statusCode: '500'
                    responseTemplates:
                      application/json: '{"message": "internal error"}'
        components:
          schemas:
            # JSON Schema (draft 4) enforced by API Gateway before anything is queued. Checks a
            # schema can't express (duplicate itemIds) are done by CreateOrder -> REJECTED.
            OrderRequest:
              type: object
              required:
                - items
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required:
                      - itemId
                      - quantity
                      - unitPrice
                    additionalProperties: false
                    properties:
                      itemId:
                        type: string
                        minLength: 1
                        maxLength: 64
                      productName:
                        type: string
                        maxLength: 200
                      quantity:
                        type: integer
                        minimum: 1
                      unitPrice:
                        type: number
                        minimum: 0
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      Auth:
        # Secure by default: every route requires a valid Cognito ID token
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100
          MetricsEnabled: true
      Tags:
        project: event-driven-orders

  # ---------------------------------------------------------------------------
  # Exercise 6: intake queue between API Gateway and CreateOrder + integration roles
  # ---------------------------------------------------------------------------
  OrderIntakeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-order-intake'
      SqsManagedSseEnabled: true
      VisibilityTimeout: 60            # 6x the CreateOrder timeout (10 s)
      MessageRetentionPeriod: 345600   # 4 days
      # Exercise 7: after 3 failed processing attempts the message moves to the DLQ
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderIntakeDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: project
          Value: event-driven-orders

  # Assumed by API Gateway for PUT /orders/{orderId}: send to the intake queue, nothing else
  ApiSqsSendRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets API Gateway send accepted orders to the intake queue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
            # No aws:SourceAccount/SourceArn condition: API Gateway does not send them when it
            # assumes integration credentials (Project 3 lesson - every call would fail).
      Policies:
        - PolicyName: send-to-intake-queue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt OrderIntakeQueue.Arn
      Tags:
        - Key: project
          Value: event-driven-orders

  # Assumed by API Gateway for GET /orders/{orderId}: read-only, the two tables only
  ApiOrdersReadRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets API Gateway read order status (BatchGetItem on Orders + Fulfilments)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-order-status
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:BatchGetItem
                Resource:
                  - !GetAtt OrdersTable.Arn
                  - !GetAtt FulfilmentsTable.Arn
      Tags:
        - Key: project
          Value: event-driven-orders

  # ---------------------------------------------------------------------------
  # Exercise 1: custom EventBridge bus - CreateOrder publishes OrderCreated here
  # ---------------------------------------------------------------------------
  OrdersEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${AWS::StackName}-bus'
      Description: Order domain events (source orders.service)
      Tags:
        - Key: project
          Value: event-driven-orders

  # Debug/audit trail: every orders.service event is copied to CloudWatch Logs so the
  # events can be inspected (and searched with Logs Insights) without a consumer.
  OrderEventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # EventBridge log targets must live under /aws/events/
      LogGroupName: !Sub '/aws/events/${AWS::StackName}'
      RetentionInDays: 14

  OrderEventsLogGroupPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-events-to-logs'
      # Allows EventBridge to write to this log group only
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"Service": ["events.amazonaws.com", "delivery.logs.amazonaws.com"]},
            "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
            "Resource": "${OrderEventsLogGroup.Arn}"
          }]
        }

  OrderEventsToLogsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-all-order-events-to-logs'
      Description: Copies every orders.service event to CloudWatch Logs
      EventBusName: !Ref OrdersEventBus
      EventPattern:
        source:
          - orders.service
      State: ENABLED
      Targets:
        - Id: order-events-log-group
          Arn: !GetAtt OrderEventsLogGroup.Arn
          # Exercise 7: undeliverable events (after retries) go to the event-targets DLQ
          RetryPolicy:
            MaximumRetryAttempts: 185        # EventBridge default, stated explicitly
            MaximumEventAgeInSeconds: 86400  # 24 h
          DeadLetterConfig:
            Arn: !GetAtt EventTargetsDLQ.Arn

  # ---------------------------------------------------------------------------
  # Exercise 2: OrderCreated -> SQS fulfilment queue -> FulfilOrder Lambda -> Fulfilments table
  # ---------------------------------------------------------------------------
  FulfilmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-Fulfilments'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: project
          Value: event-driven-orders

  FulfilmentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-fulfilment'
      SqsManagedSseEnabled: true
      # AWS guidance: at least 6x the consumer function timeout (10 s), so a message
      # isn't redelivered while a batch (incl. retries/throttling) is still in flight
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600   # 4 days
      # Exercise 7: after 3 failed processing attempts the message moves to the DLQ
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FulfilmentDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: project
          Value: event-driven-orders

  FulfilmentQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref FulfilmentQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only this rule may send to the queue (confused-deputy protection)
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt FulfilmentQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt OrderCreatedToFulfilmentRule.Arn

  OrderCreatedToFulfilmentRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-order-created-to-fulfilment'
      Description: Routes OrderCreated events to the fulfilment queue
      EventBusName: !Ref OrdersEventBus
      EventPattern:
        source:
          - orders.service
        detail-type:
          - OrderCreated
      State: ENABLED
      Targets:
        - Id: fulfilment-queue
          Arn: !GetAtt FulfilmentQueue.Arn
          # Exercise 7: undeliverable events (after retries) go to the event-targets DLQ
          RetryPolicy:
            MaximumRetryAttempts: 185        # EventBridge default, stated explicitly
            MaximumEventAgeInSeconds: 86400  # 24 h
          DeadLetterConfig:
            Arn: !GetAtt EventTargetsDLQ.Arn

  FulfilOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-FulfilOrder'
      Description: Consumes OrderCreated from SQS, records the fulfilment, publishes OrderFulfilled
      CodeUri: src/fulfil_order/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref FulfilmentsTable
          EVENT_BUS_NAME: !Ref OrdersEventBus
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref FulfilmentsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref OrdersEventBus
      Events:
        FulfilmentQueue:
          Type: SQS   # SAM adds the sqs:ReceiveMessage/DeleteMessage/GetQueueAttributes policy
          Properties:
            Queue: !GetAtt FulfilmentQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 0
            # Only failed messages are retried, not the whole batch (Powertools BatchProcessor)
            FunctionResponseTypes:
              - ReportBatchItemFailures

  FulfilOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FulfilOrderFunction}'
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # Exercise 3: SNS order notifications - OrderCreated / OrderFulfilled -> topic
  # ---------------------------------------------------------------------------
  OrderNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-order-notifications'
      DisplayName: Order notifications
      # Not encrypted on purpose: with the AWS-managed aws/sns key EventBridge can't publish
      # (its key policy can't grant events.amazonaws.com kms:GenerateDataKey). A customer
      # managed KMS key would work but costs ~$1/month; the messages carry no payment data.
      Tags:
        - Key: project
          Value: event-driven-orders

  OrderNotificationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OrderNotificationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only the notifications rule may publish (confused-deputy protection)
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OrderNotificationsTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt OrderNotificationsRule.Arn

  OrderNotificationsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-order-notifications'
      Description: Publishes a short notification to SNS for every order status change
      EventBusName: !Ref OrdersEventBus
      EventPattern:
        source:
          - orders.service
        detail-type:
          - OrderCreated
          - OrderFulfilled
      State: ENABLED
      Targets:
        - Id: order-notifications-topic
          Arn: !Ref OrderNotificationsTopic
          # Exercise 7: undeliverable events (after retries) go to the event-targets DLQ
          RetryPolicy:
            MaximumRetryAttempts: 185        # EventBridge default, stated explicitly
            MaximumEventAgeInSeconds: 86400  # 24 h
          DeadLetterConfig:
            Arn: !GetAtt EventTargetsDLQ.Arn
          # Subscribers get a small, stable notification - not the full order (items, prices)
          InputTransformer:
            InputPathsMap:
              eventType: $.detail-type
              orderId: $.detail.orderId
              customerId: $.detail.customerId
              total: $.detail.total
              warehouse: $.detail.warehouse
              time: $.time
            InputTemplate: |
              {
                "type": "<eventType>",
                "orderId": "<orderId>",
                "customerId": "<customerId>",
                "total": "<total>",
                "warehouse": "<warehouse>",
                "time": "<time>",
                "message": "<eventType>: order <orderId> (total <total>)"
              }

  # Test subscriber: lets the notifications be checked from the CLI (no email needed)
  NotificationsTestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-notifications-test'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 86400   # 1 day - test messages only
      Tags:
        - Key: project
          Value: event-driven-orders

  NotificationsTestQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationsTestQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationsTestQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrderNotificationsTopic

  NotificationsTestSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderNotificationsTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationsTestQueue.Arn
      # Deliver the notification JSON as-is instead of wrapped in an SNS envelope
      RawMessageDelivery: true

  # ---------------------------------------------------------------------------
  # Exercise 4: CloudWatch dashboard - EventBridge, SQS, SNS (+ Lambda/API health)
  # ---------------------------------------------------------------------------
  EventsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-dashboard'
      # Rule names are built from the stack name: !Ref on a rule on a custom bus
      # returns "bus|rule", which isn't a valid RuleName dimension value.
      # EventBridge, SNS and Lambda publish no datapoint for idle minutes, so those metrics
      # are wrapped in FILL(m, 0) - otherwise the graph draws a straight line between bursts.
      DashboardBody: !Sub
        - |
          {
            "start": "-PT3H",
            "widgets": [
              {
                "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
                "properties": { "markdown": "## Event-driven Orders - ${AWS::StackName}\nAPI **PUT /orders/{orderId}** → SQS **${IntakeQueueName}** → CreateOrder → bus **${OrdersEventBus}** → rules → SQS **${FulfilmentQueueName}** → FulfilOrder · SNS **${TopicName}**" }
              },
              {
                "type": "metric", "x": 0, "y": 2, "width": 8, "height": 6,
                "properties": {
                  "title": "EventBridge - MatchedEvents per rule",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ { "expression": "FILL(m1, 0)", "label": "OrderCreated → fulfilment queue", "id": "e1" } ],
                    [ { "expression": "FILL(m2, 0)", "label": "Created/Fulfilled → SNS", "id": "e2" } ],
                    [ { "expression": "FILL(m3, 0)", "label": "All events → CloudWatch Logs", "id": "e3" } ],
                    [ "AWS/Events", "MatchedEvents", "EventBusName", "${OrdersEventBus}", "RuleName", "${FulfilmentRule}", { "id": "m1", "visible": false } ],
                    [ "AWS/Events", "MatchedEvents", "EventBusName", "${OrdersEventBus}", "RuleName", "${NotificationsRule}", { "id": "m2", "visible": false } ],
                    [ "AWS/Events", "MatchedEvents", "EventBusName", "${OrdersEventBus}", "RuleName", "${LogsRule}", { "id": "m3", "visible": false } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 8, "y": 2, "width": 8, "height": 6,
                "properties": {
                  "title": "SQS - NumberOfMessagesSent",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ "AWS/SQS", "NumberOfMessagesSent", "QueueName", "${IntakeQueueName}", { "label": "intake queue (from API)" } ],
                    [ "...", "${FulfilmentQueueName}", { "label": "fulfilment queue" } ],
                    [ "...", "${TestQueueName}", { "label": "notifications test subscriber" } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 16, "y": 2, "width": 8, "height": 6,
                "properties": {
                  "title": "SNS - NumberOfMessagesPublished",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ { "expression": "FILL(m1, 0)", "label": "published", "id": "e1" } ],
                    [ { "expression": "FILL(m2, 0)", "label": "delivered", "id": "e2" } ],
                    [ { "expression": "FILL(m3, 0)", "label": "failed", "id": "e3", "color": "#d62728" } ],
                    [ "AWS/SNS", "NumberOfMessagesPublished", "TopicName", "${TopicName}", { "id": "m1", "visible": false } ],
                    [ "AWS/SNS", "NumberOfNotificationsDelivered", "TopicName", "${TopicName}", { "id": "m2", "visible": false } ],
                    [ "AWS/SNS", "NumberOfNotificationsFailed", "TopicName", "${TopicName}", { "id": "m3", "visible": false } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 8, "width": 8, "height": 6,
                "properties": {
                  "title": "EventBridge - FailedInvocations per rule",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ { "expression": "FILL(m1, 0)", "label": "fulfilment queue", "id": "e1", "color": "#d62728" } ],
                    [ { "expression": "FILL(m2, 0)", "label": "SNS", "id": "e2", "color": "#ff7f0e" } ],
                    [ { "expression": "FILL(m3, 0)", "label": "CloudWatch Logs", "id": "e3", "color": "#9467bd" } ],
                    [ "AWS/Events", "FailedInvocations", "EventBusName", "${OrdersEventBus}", "RuleName", "${FulfilmentRule}", { "id": "m1", "visible": false } ],
                    [ "AWS/Events", "FailedInvocations", "EventBusName", "${OrdersEventBus}", "RuleName", "${NotificationsRule}", { "id": "m2", "visible": false } ],
                    [ "AWS/Events", "FailedInvocations", "EventBusName", "${OrdersEventBus}", "RuleName", "${LogsRule}", { "id": "m3", "visible": false } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 8, "y": 8, "width": 8, "height": 6,
                "properties": {
                  "title": "SQS - backlog",
                  "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [
                    [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${IntakeQueueName}", { "stat": "Maximum", "label": "intake waiting" } ],
                    [ "...", "${FulfilmentQueueName}", { "stat": "Maximum", "label": "fulfilment waiting" } ],
                    [ "AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${IntakeQueueName}", { "stat": "Maximum", "label": "intake oldest (s)", "yAxis": "right" } ],
                    [ "...", "${FulfilmentQueueName}", { "stat": "Maximum", "label": "fulfilment oldest (s)", "yAxis": "right" } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 16, "y": 8, "width": 8, "height": 6,
                "properties": {
                  "title": "Lambda - Invocations & Errors",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ { "expression": "FILL(m1, 0)", "label": "CreateOrder invocations", "id": "e1" } ],
                    [ { "expression": "FILL(m2, 0)", "label": "CreateOrder errors", "id": "e2", "color": "#d62728" } ],
                    [ { "expression": "FILL(m3, 0)", "label": "FulfilOrder invocations", "id": "e3" } ],
                    [ { "expression": "FILL(m4, 0)", "label": "FulfilOrder errors", "id": "e4", "color": "#e377c2" } ],
                    [ "AWS/Lambda", "Invocations", "FunctionName", "${CreateOrderFunction}", { "id": "m1", "visible": false } ],
                    [ "AWS/Lambda", "Errors", "FunctionName", "${CreateOrderFunction}", { "id": "m2", "visible": false } ],
                    [ "AWS/Lambda", "Invocations", "FunctionName", "${FulfilOrderFunction}", { "id": "m3", "visible": false } ],
                    [ "AWS/Lambda", "Errors", "FunctionName", "${FulfilOrderFunction}", { "id": "m4", "visible": false } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 14, "width": 12, "height": 6,
                "properties": {
                  "title": "API Gateway - requests & errors",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ "AWS/ApiGateway", "Count", "ApiName", "${ApiName}", "Stage", "prod", { "label": "requests" } ],
                    [ ".", "4XXError", ".", ".", ".", ".", { "label": "4XX", "color": "#ff7f0e" } ],
                    [ ".", "5XXError", ".", ".", ".", ".", { "label": "5XX", "color": "#d62728" } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 14, "width": 12, "height": 6,
                "properties": {
                  "title": "Duration p90 (ms) - API vs Lambdas",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "p90", "period": 60,
                  "metrics": [
                    [ "AWS/ApiGateway", "Latency", "ApiName", "${ApiName}", "Stage", "prod", { "label": "API Gateway latency" } ],
                    [ "AWS/Lambda", "Duration", "FunctionName", "${CreateOrderFunction}", { "label": "CreateOrder" } ],
                    [ "...", "${FulfilOrderFunction}", { "label": "FulfilOrder" } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 20, "width": 12, "height": 6,
                "properties": {
                  "title": "Dead-letter queues - messages waiting",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
                  "metrics": [
                    [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${IntakeDLQName}", { "label": "intake DLQ (CreateOrder failed 3x)", "color": "#d62728" } ],
                    [ "...", "${FulfilmentDLQName}", { "label": "fulfilment DLQ (FulfilOrder failed 3x)", "color": "#ff7f0e" } ],
                    [ "...", "${EventTargetsDLQName}", { "label": "event targets DLQ (undeliverable)", "color": "#9467bd" } ]
                  ]
                }
              },
              {
                "type": "alarm", "x": 12, "y": 20, "width": 12, "height": 6,
                "properties": {
                  "title": "DLQ alarms",
                  "alarms": [ "${OrderIntakeDLQAlarm.Arn}", "${FulfilmentDLQAlarm.Arn}", "${EventTargetsDLQAlarm.Arn}" ]
                }
              }
            ]
          }
        - ApiName: !Sub '${AWS::StackName}-api'
          FulfilmentRule: !Sub '${AWS::StackName}-order-created-to-fulfilment'
          NotificationsRule: !Sub '${AWS::StackName}-order-notifications'
          LogsRule: !Sub '${AWS::StackName}-all-order-events-to-logs'
          IntakeQueueName: !GetAtt OrderIntakeQueue.QueueName
          IntakeDLQName: !GetAtt OrderIntakeDLQ.QueueName
          FulfilmentDLQName: !GetAtt FulfilmentDLQ.QueueName
          EventTargetsDLQName: !GetAtt EventTargetsDLQ.QueueName
          FulfilmentQueueName: !GetAtt FulfilmentQueue.QueueName
          TestQueueName: !GetAtt NotificationsTestQueue.QueueName
          TopicName: !GetAtt OrderNotificationsTopic.TopicName

  # ---------------------------------------------------------------------------
  # Exercise 7: dead-letter queues + alarms
  # ---------------------------------------------------------------------------
  # Messages that failed 3 processing attempts. Retention is the SQS maximum (14 days) so there
  # is time to investigate and redrive; the original enqueue timestamp is kept when a message
  # moves, so a DLQ's retention must be longer than its source queue's (4 days).
  OrderIntakeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-order-intake-dlq'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600   # 14 days
      # Only the intake queue may use this DLQ (and redrive back to it). The source ARN is built
      # from the name: !GetAtt would create a circular dependency with its RedrivePolicy.
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-order-intake'
      Tags:
        - Key: project
          Value: event-driven-orders

  FulfilmentDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-fulfilment-dlq'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600   # 14 days
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-fulfilment'
      Tags:
        - Key: project
          Value: event-driven-orders

  # Events EventBridge could not deliver to a rule target (after its retry policy) - a
  # different failure from the consumer DLQs above: here the message never reached the target.
  EventTargetsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-event-targets-dlq'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600   # 14 days
      Tags:
        - Key: project
          Value: event-driven-orders

  EventTargetsDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EventTargetsDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventTargetsDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !GetAtt OrderCreatedToFulfilmentRule.Arn
                  - !GetAtt OrderNotificationsRule.Arn
                  - !GetAtt OrderEventsToLogsRule.Arn

  # Alarm destination for operators (no subscription by default - add e.g. an email endpoint)
  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-ops-alerts'
      DisplayName: Orders ops alerts
      Tags:
        - Key: project
          Value: event-driven-orders

  OrderIntakeDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-order-intake-dlq-not-empty'
      AlarmDescription: Orders failed 3 CreateOrder attempts and are waiting in the intake DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt OrderIntakeDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic
      OKActions:
        - !Ref OpsAlertsTopic

  FulfilmentDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-fulfilment-dlq-not-empty'
      AlarmDescription: OrderCreated messages failed 3 FulfilOrder attempts and are in the fulfilment DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FulfilmentDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic
      OKActions:
        - !Ref OpsAlertsTopic

  EventTargetsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-event-targets-dlq-not-empty'
      AlarmDescription: EventBridge could not deliver events to a rule target
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventTargetsDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertsTopic
      OKActions:
        - !Ref OpsAlertsTopic

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      # No public self sign-up: users are created by an admin
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        project: event-driven-orders

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH   # lets the CLI fetch tokens for testing
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

Outputs:
  OrdersTableName:
    Description: Name of the Orders DynamoDB table
    Value: !Ref OrdersTable
  ApiUrl:
    Description: Base URL of the prod stage (PUT/GET {ApiUrl}/orders/{orderId})
    Value: !Sub 'https://${OrdersApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  ApiId:
    Description: REST API id
    Value: !Ref OrdersApi
  UserPoolId:
    Description: Cognito User Pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id (used to obtain tokens)
    Value: !Ref UserPoolClient
  EventBusName:
    Description: EventBridge bus receiving order events
    Value: !Ref OrdersEventBus
  EventBusArn:
    Description: ARN of the orders event bus
    Value: !GetAtt OrdersEventBus.Arn
  OrderEventsLogGroupName:
    Description: CloudWatch log group with a copy of every order event
    Value: !Ref OrderEventsLogGroup
  OrderIntakeQueueUrl:
    Description: SQS queue between API Gateway and CreateOrder
    Value: !Ref OrderIntakeQueue
  OrderIntakeDLQUrl:
    Description: Dead-letter queue for the intake queue
    Value: !Ref OrderIntakeDLQ
  FulfilmentDLQUrl:
    Description: Dead-letter queue for the fulfilment queue
    Value: !Ref FulfilmentDLQ
  EventTargetsDLQUrl:
    Description: Dead-letter queue for undeliverable EventBridge events
    Value: !Ref EventTargetsDLQ
  OpsAlertsTopicArn:
    Description: SNS topic receiving the DLQ alarms (subscribe an email to get notified)
    Value: !Ref OpsAlertsTopic
  FulfilmentsTableName:
    Description: Name of the Fulfilments DynamoDB table
    Value: !Ref FulfilmentsTable
  FulfilmentQueueUrl:
    Description: SQS queue feeding FulfilOrder
    Value: !Ref FulfilmentQueue
  FulfilOrderFunctionName:
    Description: Name of the FulfilOrder Lambda function
    Value: !Ref FulfilOrderFunction
  OrderNotificationsTopicArn:
    Description: SNS topic receiving order notifications
    Value: !Ref OrderNotificationsTopic
  NotificationsTestQueueUrl:
    Description: SQS queue subscribed to the notifications topic (for testing)
    Value: !Ref NotificationsTestQueue
  DashboardUrl:
    Description: CloudWatch dashboard
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${EventsDashboard}'
  CreateOrderFunctionName:
    Description: Name of the CreateOrder Lambda function
    Value: !Ref CreateOrderFunction
