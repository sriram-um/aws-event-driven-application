name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Never run two deployments of the stack at the same time
concurrency:
  group: deploy-orders-event-driven-app
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: orders-event-driven-app

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

  deploy:
    needs: test
    # Pull requests only run the tests; deployments happen from main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to request the GitHub OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # After scripts/teardown.sh the stacks don't exist: skip the deploy instead of failing or
      # half-creating a multi-region deployment (scripts/rebuild.sh rebuilds it in order)
      - name: Check the deployment exists
        run: |
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1 &&              aws cloudformation describe-stacks --stack-name "$STACK_NAME-global-endpoint" >/dev/null 2>&1; then
            echo "DEPLOYED=true" >> "$GITHUB_ENV"
          else
            echo "DEPLOYED=false" >> "$GITHUB_ENV"
            echo "::notice::Infrastructure is torn down - skipping deploy (run scripts/rebuild.sh to recreate it)"
          fi

      - name: Validate template
        if: env.DEPLOYED == 'true'
        run: sam validate --lint --config-env ci

      # Exercise 9: awscrt (SigV4a for the EventBridge global endpoint) as a Linux arm64 layer
      - name: Build CRT layer
        if: env.DEPLOYED == 'true'
        run: bash scripts/build_crt_layer.sh

      - name: Build (packages the Lambda code - one build, deployed to both regions)
        if: env.DEPLOYED == 'true'
        run: sam build --config-env ci

      - name: Look up the global endpoint id
        if: env.DEPLOYED == 'true'
        run: |
          echo "ENDPOINT_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME-global-endpoint" --query "Stacks[0].Outputs[?OutputKey=='EndpointId'].OutputValue" --output text)" >> "$GITHUB_ENV"

      # The primary region first: it owns the global tables, the user pool and its replica
      - name: Deploy primary region (us-east-1)
        if: env.DEPLOYED == 'true'
        run: >
          sam deploy --config-env ci
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --role-arn ${{ secrets.AWS_CFN_EXECUTION_ROLE_ARN }}
          --parameter-overrides AppVersion=${{ github.sha }} GlobalEndpointId=${{ env.ENDPOINT_ID }}

      - name: Smoke test primary region
        if: env.DEPLOYED == 'true'
        run: bash scripts/smoke_test.sh us-east-1

      - name: Look up the primary stack's outputs the secondary depends on
        if: env.DEPLOYED == 'true'
        run: |
          for key in UserPoolKeyArn UserPoolId UserPoolClientId; do
            echo "PRIMARY_$key=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='$key'].OutputValue" --output text)" >> "$GITHUB_ENV"
          done

      - name: Deploy secondary region (us-west-2)
        if: env.DEPLOYED == 'true'
        run: >
          sam deploy --config-env ci-dr
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --role-arn ${{ secrets.AWS_CFN_EXECUTION_ROLE_ARN }}
          --parameter-overrides AppVersion=${{ github.sha }} GlobalEndpointId=${{ env.ENDPOINT_ID }}
          PrimaryUserPoolKeyArn=${{ env.PRIMARY_UserPoolKeyArn }}
          PrimaryUserPoolId=${{ env.PRIMARY_UserPoolId }}
          PrimaryUserPoolClientId=${{ env.PRIMARY_UserPoolClientId }}

      - name: Smoke test secondary region
        if: env.DEPLOYED == 'true'
        run: bash scripts/smoke_test.sh us-west-2
